version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - forge_db_data:/app/data
      - ../exports:/app/exports
      - ../reports:/app/reports
    environment:
      - DATABASE_URL=sqlite:////app/data/forge.db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  forge_db_data:
